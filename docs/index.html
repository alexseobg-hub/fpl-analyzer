<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPL Анализатор</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#37003c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FPL">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;--acc:#37003c;--acc2:#00a676;--bad:#d92d20;--warn:#f79009;--chip:#f2f4f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;--mute:#98a2b3;--line:#2a2f3a;--acc:#c77dff;--acc2:#32d583;--bad:#f97066;--warn:#fdb022;--chip:#222733}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 20px 0;max-width:1200px;margin:auto}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mute);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 0;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--mute);padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1200px;margin:auto;padding:16px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}.card h3{font-size:13px;margin:12px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:12px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
td.l,th.l{text-align:left}tr:hover td{background:var(--chip)}
.scroll{overflow:auto;max-height:70vh}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--chip);font-size:11px;font-weight:600;color:var(--mute)}
.pos-GKP{color:#f79009}.pos-DEF{color:#2e90fa}.pos-MID{color:#12b76a}.pos-FWD{color:#f04438}
.good{color:var(--acc2);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.ctrl input,.ctrl select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.fx{display:inline-block;min-width:54px;padding:3px 4px;border-radius:5px;font-size:11px;font-weight:700;text-align:center;color:#111}
.cap{background:var(--acc);color:#fff;border-radius:99px;padding:0 6px;font-size:10px;margin-left:4px}
.vc{background:var(--chip);color:var(--mute);border-radius:99px;padding:0 6px;font-size:10px;margin-left:4px}
.move{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.move:last-child{border:0}.note{color:var(--mute);font-size:12px;margin-top:8px}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
.inj{opacity:.55}
.card{overflow-x:auto}
@media(max-width:700px){
 header{padding:12px 12px 0}main{padding:12px 12px 32px}
 nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}
 nav button{flex:none;padding:10px 10px}
 .card{padding:12px 10px}.kpi b{font-size:17px}
 th,td{padding:6px 5px}
 .scroll td:first-child,.scroll th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
 .move{flex-wrap:wrap}
 .hm{display:none}
}
</style>
</head>
<body>
<header>
  <h1>FPL Анализатор</h1>
  <div class="sub" id="meta">Зареждане…</div>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>
<script>
const TABS=[["advice","Съвети"],["team","Моят отбор"],["cap","Капитан"],["players","Играчи"],["compare","Сравнение"],["fx","Програма"],["price","Цени"],["league","Минилиги"]];
let D,P,T,AI=null,tab=location.hash.slice(1)||"advice";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f1=x=>x==null?"–":(+x).toFixed(1), f2=x=>x==null?"–":(+x).toFixed(2);
const tm=id=>T[id]?.short||"?";
const nm=id=>P[id]?P[id].name:"?";
const sum=a=>a.reduce((s,x)=>s+x,0);
const pos=p=>`<span class="pos-${p}">${p}</span>`;
const flag=p=>p.status!=="a"||(p.cop!=null&&p.cop<100)?` <span class="warn" title="${esc(p.news)}">⚠${p.cop!=null?p.cop+"%":""}</span>`:"";
function heat(v,lo,hi,rev){let t=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));if(rev)t=1-t;const h=t*120;return `hsl(${h},70%,${t>.5?55:62}%)`}

async function load(){
  try{
    if(window.FPL_DATA){D=window.FPL_DATA}
    else{const urls=["data.json","https://alexseobg-hub.github.io/fpl-analyzer/data.json"];
      for(const u of urls){try{const r=await fetch(u,{cache:"no-store"});if(r.ok){D=await r.json();break}}catch(e){}}}
    if(!D)throw new Error("няма данни");
  }catch(e){document.getElementById("meta").textContent="Грешка при зареждане на данните.";return}
  try{const r=await fetch("ai.json",{cache:"no-store"});if(r.ok)AI=await r.json()}catch(e){}
  P={};D.players.forEach(p=>P[p.id]=p);T=D.teams;
  const dl=D.deadline?new Date(D.deadline):null;
  document.getElementById("meta").textContent=`Обновено: ${new Date(D.generated).toLocaleString("bg-BG")} · Следващ кръг GW${D.next_gw}`+(dl?` · Дедлайн: ${dl.toLocaleString("bg-BG",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`:"");
  document.getElementById("tabs").innerHTML=TABS.map(([k,v])=>`<button data-k="${k}">${v}</button>`).join("");
  document.getElementById("tabs").onclick=e=>{if(e.target.dataset.k){tab=e.target.dataset.k;location.hash=tab;render()}};
  render();
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab));
  ({advice:vAdvice,team:vTeam,cap:vCap,players:vPlayers,compare:vCompare,fx:vFx,price:vPrice,league:vLeague}[tab]||vTeam)();
}
const gwHead=()=>D.gws.map(g=>`<th>GW${g}</th>`).join("");
function xcells(p){return p.xpts.map(x=>`<td style="color:${x>=5?'var(--acc2)':x<2?'var(--mute)':'inherit'}">${f1(x)}</td>`).join("")}


/* ---------------- Advice */
function vAdvice(){
  const ic={good:"✔",warn:"!",bad:"✖",info:"i"};
  const cats=[...new Set(D.advice.map(a=>a.cat))];
  const fresh=AI&&AI.generated?new Date(AI.generated):null;
  const aiBlock=AI?`<div class="card"><h2>AI изводи за GW${esc(AI.gw||D.next_gw)}</h2>
    <p style="margin:0 0 10px;font-size:15px">${esc(AI.summary)}</p>
    ${(AI.actions||[]).length?`<h3>Какво да направиш</h3><ol style="margin:0;padding-left:20px">${AI.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ol>`:""}
    ${(AI.players||[]).length?`<h3>Новини по играчи</h3><table><tbody>${AI.players.map(x=>`<tr><td class="l"><b>${esc(x.name)}</b></td><td class="l" style="white-space:normal">${esc(x.note)}</td><td class="l">${x.url&&/^https:\/\//.test(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener">източник</a>`:""}</td></tr>`).join("")}</tbody></table>`:""}
    <div class="note">Генерирано: ${fresh?fresh.toLocaleString("bg-BG"):"–"} · от Claude по новини, събрани с Firecrawl, и данните по-долу. Проверявай новините преди дедлайна.</div></div>`
    :`<div class="card"><h2>AI изводи</h2><div class="note" style="margin:0">Още няма. Ще се появят след първото дневно пускане на AI задачата.</div></div>`;
  const col={good:"var(--acc2)",warn:"var(--warn)",bad:"var(--bad)",info:"var(--mute)"};
  app.innerHTML=aiBlock+`<div class="card"><h2>Съвети по правила (от модела)</h2>
   ${cats.map(c=>`<h3>${esc(c)}</h3>${D.advice.filter(a=>a.cat===c).map(a=>`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><b style="color:${col[a.lvl]};width:14px;text-align:center">${ic[a.lvl]}</b><span>${esc(a.text)}</span></div>`).join("")}`).join("")}
   <div class="note">Трансфер се препоръчва, ако носи поне 2.5 очаквани точки за ${D.gws.length} кръга (претеглено), а хит само ако нетната печалба е ясно по-голяма от тази на единичния трансфер.</div></div>
   <div class="card"><h2>Новини от FPL</h2><table><tbody>${D.news.map(n=>`<tr><td class="l">${n.mine?"⭐ ":""}<b>${esc(nm(n.id))}</b> <span class="pill">${tm(P[n.id]?.team)}</span></td><td class="l" style="white-space:normal">${esc(n.text)}</td><td>${n.added?new Date(n.added).toLocaleDateString("bg-BG"):""}</td></tr>`).join("")||'<tr><td class="l">Няма новини.</td></tr>'}</tbody></table>
   <div class="note">⭐ = твой играч. Показват се новини за твоите играчи, за целите на трансферите и за играчи с над 10% притежание.</div></div>`;
}

/* ---------------- My team */
function vTeam(){
  const M=D.me, pl=M.plan[0], xi=new Set(pl.xi);
  const order={GKP:0,DEF:1,MID:2,FWD:3};
  const sq=[...M.squad].sort((a,b)=>(xi.has(b)-xi.has(a))||order[P[a].pos]-order[P[b].pos]||P[b].xpts[0]-P[a].xpts[0]);
  const chips=M.chips_left.map(c=>({wildcard:"Wildcard",freehit:"Free Hit",bboost:"Bench Boost","3xc":"Triple Captain"}[c.name])).join(", ")||"няма";
  const row=i=>{const p=P[i];return `<tr class="${p.avail<.75?'inj':''}"><td class="l">${esc(p.name)}${i===pl.cap?'<span class="cap">C</span>':''}${i===pl.vice?'<span class="vc">V</span>':''}${flag(p)}</td><td class="l">${pos(p.pos)}</td><td class="l">${tm(p.team)}</td><td>£${f1(p.price)}</td>${xcells(p)}<td><b>${f1(p.xh)}</b></td></tr>`};
  const mv=(m)=>`<div class="move"><div>${m.out.map(i=>`<span class="bad">↓ ${esc(nm(i))}</span> <span class="pill">£${f1(P[i].price)}</span>`).join("<br>")}</div><div>${m.in.map(i=>`<span class="good">↑ ${esc(nm(i))}</span> <span class="pill">${tm(P[i].team)} £${f1(P[i].price)}</span>`).join("<br>")}</div><div style="text-align:right"><b class="${m.net>0?'good':'bad'}">${m.net>0?'+':''}${f2(m.net)}</b><div class="note" style="margin:0">${m.hit?`−${m.hit} хит · `:''}банка £${f1(m.bank)}</div></div></div>`;
  app.innerHTML=`
  <div class="kpis">
    <div class="kpi"><span>Общ ранг</span><b>${M.overall_rank.toLocaleString("bg-BG")}</b></div>
    <div class="kpi"><span>Точки</span><b>${M.points}</b></div>
    <div class="kpi"><span>Банка / стойност</span><b>£${f1(M.bank)} / ${f1(M.value)}</b></div>
    <div class="kpi"><span>Свободни трансфери*</span><b>${M.ft}</b></div>
    <div class="kpi"><span>xPts GW${D.next_gw} (с капитан)</span><b>${f1(pl.xpts)}</b></div>
    <div class="kpi"><span>Чипове до GW19</span><b style="font-size:13px">${esc(chips)}</b></div>
  </div><br>
  <div class="card"><h2>${esc(M.name)} · отбор за GW${D.next_gw}</h2>
  <div class="scroll"><table><thead><tr><th class="l">Играч</th><th class="l">Поз</th><th class="l">Отбор</th><th>Цена</th>${gwHead()}<th title="претеглена сума">xP ${D.gws.length}GW</th></tr></thead>
  <tbody>${sq.filter(i=>xi.has(i)).map(row).join("")}<tr><td class="l" colspan="${5+D.gws.length}" style="color:var(--mute);font-size:11px;padding-top:12px">РЕЗЕРВИ</td></tr>${sq.filter(i=>!xi.has(i)).map(row).join("")}</tbody></table></div>
  <div class="note">Капитан по кръгове: ${M.plan.map(x=>`GW${x.gw} <b>${esc(nm(x.cap))}</b>`).join(" · ")}</div></div>
  <div class="grid2">
   <div class="card"><h2>Най-добър 1 трансфер</h2>${M.transfers.one.slice(0,8).map(mv).join("")}</div>
   <div class="card"><h2>Най-добри 2 трансфера</h2>${M.transfers.two.slice(0,8).map(mv).join("")}</div>
  </div>
  <div class="note">Печалбата е в очаквани точки за следващите ${D.gws.length} кръга (по-близките кръгове тежат повече), без хитовете. Цените за продажба са по текущата цена, защото публичното API не показва покупната. Отборът е последният публикуван (GW${D.current_gw}), така че трансфери, направени след това, не се виждат до дедлайна. *Свободните трансфери са изчислени от историята.</div>`;
}

/* ---------------- Captain */
function vCap(){
  const L=D.leagues;
  const top=[...D.players].sort((a,b)=>b.xpts[0]-a.xpts[0]).slice(0,15);
  const mine=[...D.me.plan[0].xi].sort((a,b)=>P[b].xpts[0]-P[a].xpts[0]);
  const eo=(id)=>L.map(l=>{const o=l.own[id]||0,c=l.cap[id]||0;return `<td>${o}% / ${c}%</td>`}).join("");
  const nx=p=>{const f=D.ticker.find(t=>t.id===p.team).fx[0];return f.length?f.map(x=>`${x.opp}${x.h?"(д)":"(г)"}`).join(", "):"няма мач"};
  const head=`<tr><th class="l">Играч</th><th class="l">Отбор</th><th class="l">Съперник</th><th>xPts</th><th>FPL ep</th><th>Притежание</th>${L.map(l=>`<th title="притежание / капитан">${esc(l.name.slice(0,14))}</th>`).join("")}</tr>`;
  const r=p=>`<tr><td class="l">${esc(p.name)}${flag(p)}</td><td class="l">${tm(p.team)}</td><td class="l">${nx(p)}</td><td><b>${f2(p.xpts[0])}</b></td><td>${f1(p.ep_next)}</td><td>${f1(p.own)}%</td>${eo(p.id)}</tr>`;
  app.innerHTML=`<div class="card"><h2>Капитан от моя отбор · GW${D.next_gw}</h2><div class="scroll"><table><thead>${head}</thead><tbody>${mine.map(i=>r(P[i])).join("")}</tbody></table></div>
  <div class="note">Колоните за минилигите показват колко % от лигата притежават играча / колко % са го сложили за капитан в последния кръг. Ако капитанът ти е различен от този на повечето в лигата, можеш да спечелиш или загубиш позиции.</div></div>
  <div class="card"><h2>Топ 15 по очаквани точки (всички играчи)</h2><div class="scroll"><table><thead>${head}</thead><tbody>${top.map(r).join("")}</tbody></table></div></div>`;
}

/* ---------------- Players */
let PS={pos:"",max:16,q:"",sort:"xh",dir:-1,team:""};
function vPlayers(){
  const cols=[["name","Играч",1],["team","Отбор",1],["pos","Поз",1],["price","Цена"],["own","Прит.%"],["pts","Точки"],["form","Форма"],["mins","Мин"],["xg90","xG/90"],["xa90","xA/90"],["dc_rate","DC%"],["xmin","xМин"],["x0",`xP GW${D.next_gw}`],["xh",`xP ${D.gws.length}GW`],["pc_pct","Цена Δ%"]];
  const val=(p,k)=>k==="x0"?p.xpts[0]:k==="team"?tm(p.team):p[k];
  let rows=D.players.filter(p=>(!PS.pos||p.pos===PS.pos)&&p.price<=PS.max&&(!PS.team||p.team==PS.team)&&(!PS.q||p.name.toLowerCase().includes(PS.q.toLowerCase())));
  rows.sort((a,b)=>{const x=val(a,PS.sort),y=val(b,PS.sort);return (x>y?1:x<y?-1:0)*PS.dir});
  rows=rows.slice(0,200);
  app.innerHTML=`<div class="card"><div class="ctrl">
   <input id="q" placeholder="Търси играч" value="${esc(PS.q)}">
   <select id="ps"><option value="">Всички позиции</option>${["GKP","DEF","MID","FWD"].map(x=>`<option ${PS.pos===x?"selected":""}>${x}</option>`).join("")}</select>
   <select id="pt"><option value="">Всички отбори</option>${Object.entries(T).sort((a,b)=>a[1].short.localeCompare(b[1].short)).map(([k,v])=>`<option value="${k}" ${PS.team==k?"selected":""}>${v.short}</option>`).join("")}</select>
   <label>Макс. цена £<input id="pm" type="number" step=".5" value="${PS.max}" style="width:70px"></label>
   <span class="note" style="margin:0">${rows.length} играча · клик на колона за сортиране</span></div>
   <div class="scroll"><table><thead><tr>${cols.map(([k,v,l])=>`<th class="${l?"l":""}" data-s="${k}">${v}${PS.sort===k?(PS.dir<0?" ▾":" ▴"):""}</th>`).join("")}</tr></thead><tbody>
   ${rows.map(p=>`<tr class="${p.avail<.75?'inj':''}"><td class="l">${esc(p.name)}${flag(p)}</td><td class="l">${tm(p.team)}</td><td class="l">${pos(p.pos)}</td><td>£${f1(p.price)}</td><td>${f1(p.own)}</td><td>${p.pts}</td><td>${f1(p.form)}</td><td>${p.mins}</td><td>${f2(p.xg90)}</td><td>${f2(p.xa90)}</td><td>${p.pos==="GKP"?"–":Math.round(p.dc_rate*100)}</td><td>${Math.round(p.xmin)}</td><td><b>${f1(p.xpts[0])}</b></td><td><b>${f1(p.xh)}</b></td><td class="${p.pc_pct>=70?'good':p.pc_pct<=-70?'bad':''}">${Math.round(p.pc_pct)}</td></tr>`).join("")}
   </tbody></table></div>
   <div class="note">xP ${D.gws.length}GW е претеглена сума (по-близките кръгове тежат повече). DC% е колко често играчът взима бонус за защитни действия, когато играе 60+ минути. Цена Δ% е прогресът към промяна в цената по данни на FPL: +100 значи поскъпване, −100 поевтиняване.</div></div>`;
  q.oninput=e=>{PS.q=e.target.value;vPlayers();const el=document.getElementById("q");el.focus();el.setSelectionRange(99,99)};
  ps.onchange=e=>{PS.pos=e.target.value;vPlayers()};pt.onchange=e=>{PS.team=e.target.value;vPlayers()};
  pm.onchange=e=>{PS.max=+e.target.value||16;vPlayers()};
  app.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{const k=th.dataset.s;PS.dir=PS.sort===k?-PS.dir:-1;PS.sort=k;vPlayers()});
}

/* ---------------- Compare */
let CMP=[null,null];
function vCompare(){
  const list=[...D.players].sort((a,b)=>a.name.localeCompare(b.name));
  if(!CMP[0]){const s=[...D.me.squad].sort((a,b)=>P[b].xh-P[a].xh);CMP=[s[0],s[1]]}
  const sel=(i)=>`<select data-i="${i}">${list.map(p=>`<option value="${p.id}" ${CMP[i]==p.id?"selected":""}>${esc(p.name)} (${tm(p.team)}, £${f1(p.price)})</option>`).join("")}</select>`;
  const a=P[CMP[0]],b=P[CMP[1]];
  const rows=[["Позиция",p=>p.pos],["Цена",p=>p.price,1],["Притежание %",p=>p.own],["Точки",p=>p.pts,1],["Форма",p=>p.form,1],["Минути",p=>p.mins,1],["Голове / асистенции",p=>`${p.g} / ${p.a}`],["xG / xA",p=>`${f2(p.xg)} / ${f2(p.xa)}`],["xG/90",p=>p.xg90,1],["xA/90",p=>p.xa90,1],["Бонус",p=>p.bonus,1],["DC%",p=>Math.round(p.dc_rate*100),1],["Очаквани минути",p=>p.xmin,1],["Последни 5 кръга",p=>p.form5.join(" · ")],["Дузпи (ред)",p=>p.pen??"–"],
   ...D.gws.map((g,i)=>[`xPts GW${g}`,p=>p.xpts[i],1]),[`xPts ${D.gws.length}GW (претеглени)`,p=>p.xh,1],["Новини",p=>p.news||"–"]];
  app.innerHTML=`<div class="card"><h2>Сравнение на двама играчи</h2><div class="ctrl">${sel(0)} <b>vs</b> ${sel(1)}</div>
  <table><tbody>${rows.map(([l,fn,num])=>{let x=fn(a),y=fn(b);let ca="",cb="";if(num&&typeof x==="number"&&x!==y){const better=l==="Цена"?x<y:x>y;ca=better?"good":"";cb=better?"":"good"}
   const fm=v=>typeof v==="number"?(Number.isInteger(v)?v:f2(v)):esc(v);return `<tr><td class="l" style="color:var(--mute)">${l}</td><td class="${ca}">${fm(x)}</td><td class="${cb}">${fm(y)}</td></tr>`}).join("")}</tbody></table></div>`;
  app.querySelectorAll("select[data-i]").forEach(s=>s.onchange=e=>{CMP[+s.dataset.i]=+e.target.value;vCompare()});
}

/* ---------------- Fixtures ticker */
let FXM="att";
function vFx(){
  const rows=[...D.ticker].map(t=>({...t,score:sum(t.fx.map(g=>sum(g.map(x=>FXM==="att"?x.att:-x.def))))})).sort((a,b)=>b.score-a.score);
  app.innerHTML=`<div class="card"><h2>Програма за следващите ${D.gws.length} кръга</h2><div class="ctrl">
   <select id="fm"><option value="att" ${FXM==="att"?"selected":""}>За атакуващи: очаквани голове на отбора</option><option value="def" ${FXM==="def"?"selected":""}>За защитници: очаквани допуснати голове</option></select></div>
   <div class="scroll"><table><thead><tr><th class="l">Отбор</th>${gwHead()}<th>${FXM==="att"?"Σ xG":"Σ xGC"}</th></tr></thead><tbody>
   ${rows.map(t=>`<tr><td class="l"><b>${t.short}</b></td>${t.fx.map(g=>`<td>${g.length?g.map(x=>{const v=FXM==="att"?x.att:x.def;return `<span class="fx" style="background:${heat(v,.8,2.2,FXM==="def")}" title="${v}">${x.opp}${x.h?"":" (г)"}</span>`}).join(" "):'<span class="pill">няма</span>'}</td>`).join("")}<td>${f1(Math.abs(t.score))}</td></tr>`).join("")}
   </tbody></table></div><div class="note">Цветовете са от нашия модел (xG за и против, като скорошните мачове тежат повече, плюс домакинско предимство), а не от FDR на FPL. Зелено значи по-лесно. (г) означава гост. Двойните кръгове се виждат като два мача в една клетка, а празните като „няма“.</div></div>`;
  fm.onchange=e=>{FXM=e.target.value;vFx()};
}

/* ---------------- Prices */
function vPrice(){
  const mine=new Set(D.me.squad);
  const up=D.players.filter(p=>p.pc_pct>=50).sort((a,b)=>b.pc_pct-a.pc_pct).slice(0,25);
  const dn=D.players.filter(p=>p.pc_pct<=-50).sort((a,b)=>a.pc_pct-b.pc_pct).slice(0,25);
  const bar=v=>`<span class="bar"><i style="width:${Math.min(100,Math.abs(v))}%;background:${v>0?'var(--acc2)':'var(--bad)'}"></i></span>`;
  const tb=l=>`<table><thead><tr><th class="l">Играч</th><th class="l">Отбор</th><th>Цена</th><th>Прогрес</th><th>%</th><th>Трансфери (кръг)</th></tr></thead><tbody>${l.map(p=>`<tr><td class="l">${mine.has(p.id)?"⭐ ":""}${esc(p.name)}</td><td class="l">${tm(p.team)}</td><td>£${f1(p.price)}</td><td>${bar(p.pc_pct)}</td><td>${Math.round(p.pc_pct)}</td><td>${(p.tin-p.tout).toLocaleString("bg-BG")}</td></tr>`).join("")}</tbody></table>`;
  const my=D.me.squad.map(i=>P[i]).sort((a,b)=>b.pc_pct-a.pc_pct);
  app.innerHTML=`<div class="card"><h2>Моите играчи</h2><table><thead><tr><th class="l">Играч</th><th>Цена</th><th>Δ този кръг</th><th>Δ от началото</th><th>Прогрес</th><th>%</th></tr></thead><tbody>${my.map(p=>`<tr><td class="l">${esc(p.name)}</td><td>£${f1(p.price)}</td><td>${p.cost_ev?f1(p.cost_ev):"–"}</td><td class="${p.cost_start>0?'good':p.cost_start<0?'bad':''}">${p.cost_start>0?"+":""}${f1(p.cost_start)}</td><td>${bar(p.pc_pct)}</td><td>${Math.round(p.pc_pct)}</td></tr>`).join("")}</tbody></table></div>
  <div class="grid2"><div class="card"><h2>Близо до поскъпване</h2>${tb(up)}</div><div class="card"><h2>Близо до поевтиняване</h2>${tb(dn)}</div></div>
  <div class="note">Данните са от FPL (price_change_percent): при +100% играчът поскъпва, при −100% поевтинява. Промените стават през нощта. Данните са към момента на последното обновяване.</div>`;
}

/* ---------------- Leagues */
let LI=0;
function vLeague(){
  const L=D.leagues[LI], me=L.members.find(m=>m.entry===D.me.id)||{total:0,squad:[]};
  const mySet=new Set(D.me.squad);
  const chipN={wildcard:"WC",freehit:"FH",bboost:"BB","3xc":"TC"};
  const threats=Object.entries(L.own).map(([id,o])=>({p:P[id],o:+o})).filter(x=>x.p&&!mySet.has(x.p.id)&&x.o>=30).sort((a,b)=>b.o-a.o||b.p.xh-a.p.xh).slice(0,12);
  const diffs=D.me.squad.map(i=>({p:P[i],o:L.own[i]||0})).filter(x=>x.o<=35).sort((a,b)=>a.o-b.o);
  app.innerHTML=`<div class="ctrl">${D.leagues.map((l,i)=>`<button class="pill" style="cursor:pointer;padding:6px 12px;${i===LI?'background:var(--acc);color:#fff':''}" data-l="${i}">${esc(l.name)}</button>`).join("")}</div>
  <div class="card"><h2>${esc(L.name)} · класиране</h2><div class="scroll"><table><thead><tr><th>#</th><th class="l">Отбор</th><th class="l hm">Мениджър</th><th>Общо</th><th>Разлика</th><th>GW${D.current_gw}</th><th class="l">Капитан</th><th>Чип</th><th>xPts GW${D.next_gw}</th><th>Хитове</th><th>Стойност</th><th class="l">Чипове до GW19</th></tr></thead><tbody>
  ${L.members.map(m=>{const d=m.total-me.total;return `<tr style="${m.entry===D.me.id?'font-weight:700':''}"><td>${m.rank}${m.last_rank&&m.last_rank!==m.rank?(m.rank<m.last_rank?' <span class="good">▲</span>':' <span class="bad">▼</span>'):''}</td><td class="l">${esc(m.team)}</td><td class="l hm">${esc(m.player)}</td><td>${m.total}</td><td class="${d>0?'bad':d<0?'good':''}">${d>0?'+':''}${d}</td><td>${m.gw}</td><td class="l">${esc(nm(m.cap))}</td><td>${m.chip?chipN[m.chip]||m.chip:""}</td><td>${f1(m.next_xpts)}</td><td>${m.hits?"-"+m.hits:0}</td><td>£${f1(m.value)}</td><td class="l">${m.chips_left.map(c=>chipN[c]).join(" ")}</td></tr>`}).join("")}
  </tbody></table></div><div class="note">xPts GW${D.next_gw} е очакваният резултат на всеки отбор с последния му състав, най-добрия стартов състав и капитан по нашия модел.</div></div>
  <div class="grid2">
   <div class="card"><h2>Играчи, които много от лигата имат, а ти не</h2><table><thead><tr><th class="l">Играч</th><th class="l">Отбор</th><th>Прит. в лигата</th><th>xP GW${D.next_gw}</th><th>xP ${D.gws.length}GW</th></tr></thead><tbody>${threats.map(x=>`<tr><td class="l">${esc(x.p.name)}</td><td class="l">${tm(x.p.team)}</td><td>${x.o}%</td><td>${f1(x.p.xpts[0])}</td><td>${f1(x.p.xh)}</td></tr>`).join("")}</tbody></table></div>
   <div class="card"><h2>Твоите диференциали (≤35% в лигата)</h2><table><thead><tr><th class="l">Играч</th><th class="l">Отбор</th><th>Прит. в лигата</th><th>xP GW${D.next_gw}</th><th>xP ${D.gws.length}GW</th></tr></thead><tbody>${diffs.map(x=>`<tr><td class="l">${esc(x.p.name)}</td><td class="l">${tm(x.p.team)}</td><td>${x.o}%</td><td>${f1(x.p.xpts[0])}</td><td>${f1(x.p.xh)}</td></tr>`).join("")}</tbody></table></div>
  </div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{LI=+b.dataset.l;vLeague()});
}
const app=document.getElementById("app");
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(D&&k&&k!==tab){tab=k;render()}});
load();
</script>
</body>
</html>
